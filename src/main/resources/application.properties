spring.application.name=metamorph

# MySQL Datasource configuration (shared)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:metamorph_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:metamorph_user}
spring.datasource.password=${MYSQL_PASSWORD:metamorph_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration (shared)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

aws.region=${AWS_REGION}
aws.s3.bucket=${S3_BUCKET}
