services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: metamorph-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      VITE_API_URL: http://app:8081
    depends_on:
      - app
    networks:
      - metamorph-network

  app:
    build:
      context: .
      dockerfile: src/main/java/com/example/metamorph/app/Dockerfile
    container_name: metamorph-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: ${PORT:-8080}
      DB_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-metamorph_db}
      MYSQL_USER: ${MYSQL_USER:-metamorph_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-metamorph_password}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY_MS: ${JWT_ACCESS_EXPIRY_MS:-900000}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS:-604800000}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - metamorph-network

  worker:
    build:
      context: .
      dockerfile: src/main/java/com/example/metamorph/worker/Dockerfile
    container_name: metamorph-worker
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-metamorph_db}
      MYSQL_USER: ${MYSQL_USER:-metamorph_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-metamorph_password}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started
    networks:
      - metamorph-network

  mysql:
    image: mysql:8.4
    container_name: metamorph-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-metamorph_db}
      MYSQL_USER: ${MYSQL_USER:-metamorph_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-metamorph_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - metamorph-network

volumes:
  mysql_data:
    driver: local

networks:
  metamorph-network:
    driver: bridge
